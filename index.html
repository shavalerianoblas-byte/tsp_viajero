<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Diseño: dos paneles (controles a la izquierda, grafo a la derecha). En pantallas angostas el grafo va primero. */
:root {
  --bg: #f3f5f9; --surface: #ffffff; --ink: #16202e; --muted: #586577; --line: #d6dce6;
  --primary: #1f3a5f; --on-primary: #ffffff; --gold: #f2c14e; --node: #bcdcf2; --tint: #e4edf8;
  --ok: #1b7f1b; --bad: #b00020; --warn: #a35200; --sel: #2a62b8; --alt: #b8600f; --on-hl: #ffffff;
  --edge: #7d8693; --edge-dim: #cfd4dc;
  --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e141c; --surface: #161f2b; --ink: #e7edf5; --muted: #93a1b4; --line: #2a3646;
    --primary: #8db6ec; --on-primary: #0e141c; --gold: #e0b13f; --node: #27425f; --tint: #1e3047;
    --ok: #5fcf6a; --bad: #ff7a8e; --warn: #f0a35a; --sel: #6aa6f5; --alt: #f0a35a; --on-hl: #0e141c;
    --edge: #8a97a8; --edge-dim: #35414f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e141c; --surface: #161f2b; --ink: #e7edf5; --muted: #93a1b4; --line: #2a3646;
  --primary: #8db6ec; --on-primary: #0e141c; --gold: #e0b13f; --node: #27425f; --tint: #1e3047;
  --ok: #5fcf6a; --bad: #ff7a8e; --warn: #f0a35a; --sel: #6aa6f5; --alt: #f0a35a; --on-hl: #0e141c;
  --edge: #8a97a8; --edge-dim: #35414f; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; margin: 0; }
.app { max-width: 1280px; margin: 0 auto; padding-block: 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { text-wrap: balance; line-height: 1.2; margin: 0; }
h1 { font-size: 26px; font-weight: 600; }
h2 { font-size: 17px; font-weight: 600; }
p { margin: 0; }
b { font-weight: 600; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 11; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 14px; background: var(--primary); color: var(--on-primary); border-radius: 10px; padding: 10px 16px; }
.nav { display: flex; gap: 6px; flex-wrap: wrap; }
.navbtn { font: inherit; font-size: 14px; font-weight: 500; color: inherit; background: transparent; border: 1px solid rgba(255,255,255,.45); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.navbtn:hover:not([disabled]) { background: rgba(255,255,255,.18); }
.navbtn[disabled] { opacity: .45; cursor: default; }
.navbtn:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand strong { font-size: 20px; letter-spacing: .02em; }
.brand span { opacity: .85; font-size: 14px; }
.who { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.who input { width: 190px; max-width: 100%; padding: 6px 10px; border-radius: 6px; border: 1px solid transparent; background: rgba(255,255,255,.16); color: inherit; font: inherit; }
.who input::placeholder { color: inherit; opacity: .7; }

.steps { display: flex; flex-wrap: wrap; gap: 6px 22px; list-style: none; margin: 14px 0 16px; padding: 0; font-size: 14px; color: var(--muted); }
.steps li { display: flex; align-items: center; gap: 8px; }
.steps .dot { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 600; }
.steps li.on { color: var(--ink); font-weight: 600; }
.steps li.on .dot { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.steps li.past .dot { border-color: var(--ok); color: var(--ok); }

.grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 18px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.pane-controls { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.pane-graph { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); min-width: 0; }
@media (max-width: 900px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .pane-graph { order: -1; position: static; }
  .graph { max-height: 62vh; }
}
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.lead { color: var(--muted); max-width: 62ch; }
.hint { color: var(--muted); font-size: 13px; }
.msg { font-size: 14px; min-height: 1.4em; }
.msg.bad { color: var(--bad); } .msg.ok { color: var(--ok); } .msg.warn { color: var(--warn); }

.field { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.field span { color: var(--muted); }
input[type=text], input[type=number], select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-width: 0; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.row .field { flex: 1 1 110px; }
.btn { font: inherit; font-weight: 500; padding: 9px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn:hover { border-color: var(--primary); }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); font-weight: 600; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: default; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

.dir { border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; margin: 0; flex: 1 1 100%; display: flex; flex-wrap: wrap; gap: 6px 22px; }
.dir legend { padding: 0 6px; font-size: 13px; color: var(--muted); }
.dir label { display: flex; align-items: flex-start; gap: 8px; font-size: 14px; }
.dir label small { display: block; color: var(--muted); }
.dir input { margin-top: 4px; }

.params { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; color: var(--muted); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tab { font: inherit; font-weight: 500; background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px; color: var(--muted); cursor: pointer; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--primary); }

.elist { list-style: none; margin: 0; padding: 0; max-height: 230px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; }
.elist li { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-bottom: 1px solid var(--line); font-family: var(--font-mono); font-size: 14px; }
.elist li:last-child { border-bottom: 0; }
.elist .grow { flex: 1; }
.tag { display: inline-grid; place-items: center; min-width: 26px; height: 22px; border-radius: 4px; font-size: 13px; font-weight: 600; }
.tag.bi { background: var(--tint); color: var(--sel); }
.tag.uni { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.empty { color: var(--muted); font-size: 14px; padding: 4px 0; }

.scroll { overflow-x: auto; }
table.mx { border-collapse: collapse; font-family: var(--font-mono); font-size: 13px; }
.mx th, .mx td { border: 1px solid var(--line); padding: 4px 8px; text-align: right; font-variant-numeric: tabular-nums; min-width: 38px; }
.mx th { background: var(--bg); color: var(--muted); font-weight: 500; }
.mx td.bi { background: var(--tint); }
.mx td.none { color: var(--muted); text-align: center; }
.degs { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 2px 14px; font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
.degs .full { color: var(--warn); font-weight: 500; }

.callout { border-left: 4px solid var(--line); padding: 8px 12px; background: var(--bg); border-radius: 0 6px 6px 0; font-size: 14px; }
.callout.ok { border-color: var(--ok); } .callout.bad { border-color: var(--bad); }
.callout ul { margin: 6px 0 0; padding-left: 18px; }
.sugg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

.graph { display: block; width: 100%; height: auto; max-height: 76vh; }
.e-base { stroke: var(--edge); stroke-width: 1.6; fill: none; }
.e-dim { stroke: var(--edge-dim); stroke-width: 1.3; fill: none; }
.e-hl { fill: none; stroke-width: 4.2; stroke-linecap: round; }
.mk-b { fill: var(--edge); } .mk-d { fill: var(--edge-dim); }
.node { fill: var(--node); stroke: var(--primary); stroke-width: 2; }
.node.start { fill: var(--gold); }
.nlab { fill: var(--ink); font-weight: 600; text-anchor: middle; font-family: var(--font-body); }
.nlab.start { fill: #1a1a1a; }
.wlab { fill: var(--ink); font-size: 13px; font-weight: 500; text-anchor: middle; paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; font-family: var(--font-mono); }
.wlab.dim { fill: var(--muted); }
.chip text { fill: var(--on-hl); font-size: 13px; font-weight: 600; text-anchor: middle; font-family: var(--font-mono); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; list-style: none; margin: 10px 0 0; padding: 0; font-size: 13px; color: var(--muted); }
.legend li { display: flex; align-items: center; gap: 8px; }
.legend svg { flex: none; }
.counts { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; font-size: 13.5px; }
.counts b { font-family: var(--font-mono); }
.cap { font-size: 14px; color: var(--muted); margin: 4px 0 6px; }

.mono-box { font-family: var(--font-mono); font-size: 13.5px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.status-valid { color: var(--ok); } .status-invalid { color: var(--bad); }
.progress { height: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--primary); }
.big { font-size: 34px; font-weight: 600; font-variant-numeric: tabular-nums; }
.route { font-family: var(--font-mono); font-size: 17px; font-weight: 500; overflow-wrap: anywhere; }
.results { max-height: 300px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; }
.results button { display: grid; grid-template-columns: 44px 1fr auto; gap: 8px; width: 100%; text-align: left; font-family: var(--font-mono); font-size: 13px; padding: 5px 10px; border: 0; border-bottom: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.results button.best { background: var(--tint); }
.results button[aria-current="true"] { outline: 2px solid var(--sel); outline-offset: -2px; }
textarea.imp { width: 100%; font-family: var(--font-mono); font-size: 13px; min-height: 150px; resize: vertical; }
.modes.one { grid-template-columns: minmax(0, 1fr); }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.mode { display: flex; flex-direction: column; gap: 6px; text-align: left; font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 14px; cursor: pointer; }
.mode b { font-size: 17px; }
.mode span { color: var(--muted); font-size: 14px; }
.mode:hover { border-color: var(--primary); background: var(--tint); }
.mode:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
@media (prefers-reduced-motion: no-preference) { .progress i { transition: width .08s linear; } }
</style>

<div class="app">
  <header class="top">
    <div class="brand"><strong>TSP</strong><span>Problema del agente viajero por fuerza bruta</span></div>
    <nav class="nav" aria-label="Navegación principal">
      <button class="navbtn" id="navBack" type="button">← Atrás</button>
      <button class="navbtn" id="navHome" type="button">Menú de inicio</button>
    </nav>
    <label class="who">Tu nombre <input id="user" type="text" maxlength="40" placeholder="Opcional" autocomplete="name"></label>
  </header>
  <ol class="steps" id="steps"></ol>
  <main id="view"></main>
</div>

<script id="logic">
/* ---------- Lógica pura (sin DOM) ---------- */
var MAX_RANDOM_DEGREE = 3;
function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function zeros(n) { var m = []; for (var i = 0; i < n; i++) m.push(new Array(n).fill(0)); return m; }
function outDeg(m, i) { var c = 0; for (var j = 0; j < m.length; j++) if (m[i][j] > 0) c++; return c; }
function inDeg(m, j) { var c = 0; for (var i = 0; i < m.length; i++) if (m[i][j] > 0) c++; return c; }
function fact(k) { var f = 1; for (var i = 2; i <= k; i++) f *= i; return f; }
function fmt(x) { return Number.isInteger(x) ? String(x) : String(+x.toFixed(2)); }

function checkEdge(g, u, v, w) {
  var n = g.n, m = g.m;
  if (!Number.isInteger(u) || !Number.isInteger(v) || u < 0 || v < 0 || u >= n || v >= n) return 'Los nodos deben estar entre 0 y ' + (n - 1) + '.';
  if (u === v) return 'No se permiten auto-ciclos (origen igual a destino).';
  if (!isFinite(w) || w <= 0) return 'El peso debe ser un número mayor que 0.';
  if (m[u][v] === 0) {
    if (outDeg(m, u) >= g.maxOut) return 'El nodo ' + u + ' ya tiene ' + g.maxOut + ' arista(s) saliente(s), que es su límite.';
    if (inDeg(m, v) >= g.maxIn) return 'El nodo ' + v + ' ya tiene ' + g.maxIn + ' arista(s) entrante(s), que es su capacidad.';
  }
  return null;
}

function circlePos(n, slots) {
  var r = [];
  for (var i = 0; i < n; i++) { var a = 2 * Math.PI * slots[i] / n; r.push([Math.cos(a), -Math.sin(a)]); }
  return r;
}
function defaultPos(n) { var s = []; for (var i = 0; i < n; i++) s.push(i); return circlePos(n, s); }

/* Reubica los nodos en la circunferencia para reducir cruces. El nodo 0 queda fijo a la derecha. */
function orderCircle(n, m) {
  var edges = [];
  for (var i = 0; i < n; i++) for (var j = 0; j < n; j++) if (m[i][j] > 0) edges.push([i, j]);
  function cost(slot) {
    var ch = edges.map(function (e) { var a = slot[e[0]], b = slot[e[1]]; return a < b ? [a, b] : [b, a]; });
    var cr = 0;
    for (var x = 0; x < ch.length; x++) for (var y = x + 1; y < ch.length; y++) {
      var a = ch[x][0], b = ch[x][1], c = ch[y][0], d = ch[y][1];
      if (new Set([a, b, c, d]).size === 4 && ((a < c && c < b) !== (a < d && d < b))) cr++;
    }
    var largo = 0;
    edges.forEach(function (e) { var dd = Math.abs(slot[e[0]] - slot[e[1]]); largo += Math.min(dd, n - dd); });
    return 100 * cr + largo;
  }
  var best = []; for (var k = 0; k < n; k++) best.push(k);
  var bestCost = null;
  for (var r = 0; r < 12; r++) {
    var rest = []; for (var q = 1; q < n; q++) rest.push(q);
    shuffle(rest);
    var slot = new Array(n).fill(0);
    rest.forEach(function (node, s) { slot[node] = s + 1; });
    var cur = cost(slot), imp = true;
    while (imp) {
      imp = false;
      for (var a2 = 1; a2 < n; a2++) for (var b2 = a2 + 1; b2 < n; b2++) {
        var t = slot[a2]; slot[a2] = slot[b2]; slot[b2] = t;
        var c2 = cost(slot);
        if (c2 < cur) { cur = c2; imp = true; } else { t = slot[a2]; slot[a2] = slot[b2]; slot[b2] = t; }
      }
    }
    if (bestCost === null || cur < bestCost) { best = slot.slice(); bestCost = cur; }
  }
  return circlePos(n, best);
}

/* Generación aleatoria MIXTA: parte de un ciclo hamiltoniano dirigido (hay solución),
   convierte algunas de sus aristas en bidireccionales (mismo peso de ida y vuelta)
   y agrega aristas unidireccionales extra. Siempre incompleto y respeta los límites. */
function randomMixed(g, frac) {
  var n = g.n, m = g.m;
  for (var i = 0; i < n; i++) m[i].fill(0);
  var order = shuffle(Array.from({ length: n }, function (_, k) { return k; }));
  var cyc = [];
  for (var k = 0; k < n; k++) {
    var u = order[k], v = order[(k + 1) % n];
    m[u][v] = rnd(1, 20);
    cyc.push([u, v]);
  }
  var topOut = Math.min(g.maxOut, MAX_RANDOM_DEGREE), topIn = Math.min(g.maxIn, MAX_RANDOM_DEGREE);
  var wantBi = Math.min(n - 1, Math.max(1, Math.round(frac * n)));
  var made = 0;
  shuffle(cyc.slice()).forEach(function (e) {
    if (made >= wantBi) return;
    var a = e[0], b = e[1];
    if (m[b][a] === 0 && outDeg(m, b) < topOut && inDeg(m, a) < topIn) { m[b][a] = m[a][b]; made++; }
  });
  var objetivo = [];
  for (var x = 0; x < n; x++) objetivo.push(rnd(Math.min(2, topOut), topOut));
  var pares = [];
  for (var p = 0; p < n; p++) for (var q = 0; q < n; q++) if (p !== q && m[p][q] === 0 && m[q][p] === 0) pares.push([p, q]);
  shuffle(pares);
  pares.forEach(function (e) {
    var a = e[0], b = e[1];
    if (m[b][a] === 0 && outDeg(m, a) < objetivo[a] && inDeg(m, b) < topIn) m[a][b] = rnd(1, 20);
  });
  return countTypes(n, m);
}

function countTypes(n, m) {
  var bi = 0, dif = 0, uni = 0;
  for (var i = 0; i < n; i++) for (var j = i + 1; j < n; j++) {
    var a = m[i][j] > 0, b = m[j][i] > 0;
    if (a && b) { if (m[i][j] === m[j][i]) bi++; else dif++; } else if (a || b) uni++;
  }
  return { bi: bi, dif: dif, uni: uni };
}
function isComplete(n, m) { for (var i = 0; i < n; i++) for (var j = 0; j < n; j++) if (i !== j && !(m[i][j] > 0)) return false; return true; }
function isSymmetric(n, m) { for (var i = 0; i < n; i++) for (var j = i + 1; j < n; j++) if (m[i][j] !== m[j][i]) return false; return true; }

function reach(n, m, rev) {
  var seen = new Array(n).fill(false), st = [0]; seen[0] = true;
  while (st.length) {
    var x = st.pop();
    for (var y = 0; y < n; y++) {
      var w = rev ? m[y][x] : m[x][y];
      if (w > 0 && !seen[y]) { seen[y] = true; st.push(y); }
    }
  }
  return seen.every(Boolean);
}
function diagnose(n, m) {
  var sinSalida = [], sinEntrada = [];
  for (var i = 0; i < n; i++) { if (outDeg(m, i) < 1) sinSalida.push(i); if (inDeg(m, i) < 1) sinEntrada.push(i); }
  return { sinSalida: sinSalida, sinEntrada: sinEntrada, conexo: reach(n, m, false) && reach(n, m, true) };
}
function suggestEdges(g, d) {
  var n = g.n, m = g.m, out = [], seen = {};
  function add(u, v) { var k = u + '>' + v; if (!seen[k]) { seen[k] = 1; out.push([u, v]); } }
  d.sinSalida.forEach(function (u) { for (var j = 0; j < n; j++) if (j !== u && m[u][j] === 0 && inDeg(m, j) < g.maxIn) add(u, j); });
  d.sinEntrada.forEach(function (v) { for (var i = 0; i < n; i++) if (i !== v && m[i][v] === 0 && outDeg(m, i) < g.maxOut) add(i, v); });
  return out;
}
function modoBusqueda(n, m) {
  var tot = fact(n - 1);
  if (isSymmetric(n, m)) {
    var t = tot / 2;

      var li = '';
      if (d.sinSalida.length) li += '<li>Nodos sin aristas salientes: ' + d.sinSalida.join(', ') + '</li>';
      if (d.sinEntrada.length) li += '<li>Nodos sin aristas entrantes: ' + d.sinEntrada.join(', ') + '</li>';
      if (!d.sinSalida.length && !d.sinEntrada.length && !d.conexo) li += '<li>El grafo no es fuertemente conexo: no se puede llegar de cualquier nodo a cualquier otro siguiendo las flechas.</li>';
      var sug = suggestEdges(G(), d).slice(0, 8);
      diag.innerHTML = '<div class="callout bad"><b>Aún no puede existir un ciclo que visite todos los nodos.</b><ul>' + li + '</ul>' +
        (sug.length ? '<p style="margin-top:8px">Aristas sugeridas (respetan tus límites). Toca una para llenar el formulario:</p><div class="sugg">' + sug.map(function (s) { return '<button class="btn small" data-su="' + s[0] + ',' + s[1] + '">' + s[0] + ' → ' + s[1] + '</button>'; }).join('') + '</div>' : '') + '</div>';
    } else {
      diag.innerHTML = '<div class="callout ok"><b>Se cumplen las condiciones necesarias para un ciclo hamiltoniano.</b><p>' + esc(modoBusqueda(n, m).text) + '</p></div>' +
        '<div class="actions"><button class="btn primary" id="solve" type="button">Buscar la ruta óptima</button></div>';
    }
    $('#gtitle').textContent = rows.length ? typeTitle() : 'Vista previa del grafo';
    $('#graphBox').innerHTML = drawGraph(G());
    $('#legendBox').innerHTML = legend() + countsHtml(n, m);
  }

  /* ---------- Pantalla 3: búsqueda paso a paso ---------- */
  function startSolve() {
    S.run = createRun(S.n, S.m.map(function (r) { return r.slice(); }));
    S.sum = null; S.busy = false;
    go('solve');
  }
  function viewSolve() {
    var r = S.run;
    $('#view').innerHTML =
      '<div class="grid"><section class="panel stack">' +
      '<h1>Búsqueda por fuerza bruta</h1>' +
      '<p class="lead">El nodo 0 es el inicio. Cada ruta candidata es un orden distinto de los demás nodos que termina de vuelta en el 0. Es válida si existe cada arista en el sentido recorrido, y su costo es la suma de los pesos.</p>' +
      '<p><b>Rutas a evaluar: ' + r.total.toLocaleString('es') + '</b></p><p class="hint">' + esc(r.text) + '</p>' +
      '<div class="callout" aria-live="polite"><pre id="info" class="mono-box"></pre></div>' +
      '<div class="actions" id="stepBtns"><button class="btn primary" id="nxt" type="button">Siguiente paso</button><button class="btn" id="nxv" type="button">Siguiente ciclo válido</button><button class="btn" id="fin" type="button">Saltar al resultado final</button><button class="btn" id="bck" type="button">Volver al grafo</button></div>' +
      '<div id="prog" hidden><p class="hint" id="progTxt"></p><div class="progress"><i id="progBar"></i></div></div>' +
      '</section><section class="panel pane-graph"><h2 id="gtitle"></h2><div id="graphBox"></div>' + legend() + '</section></div>';
    $('#nxt').addEventListener('click', nextStep);
    $('#nxv').addEventListener('click', nextValid);
    $('#fin').addEventListener('click', finishAll);
    $('#bck').addEventListener('click', function () { if (!S.busy) go('build'); });
    nextStep();
  }
  function showStep() {
    var r = S.run, camino = [0].concat(r.perm, [0]);
    $('#info').innerHTML =
      'Ruta        : ' + r.idx.toLocaleString('es') + ' / ' + r.total.toLocaleString('es') + '\n' +
      'Estado      : <span class="' + (r.lastOk ? 'status-valid' : 'status-invalid') + '">' + (r.lastOk ? 'VÁLIDA' : 'NO VÁLIDA (falta una arista)') + '</span>\n' +
      'Costo total : ' + (r.lastOk ? fmt(r.lastCost) : '-') + '\n' +
      'Ciclos válidos hallados: ' + r.costs.length.toLocaleString('es') + '\n\nRuta evaluada:\n' + camino.join(' → ');
    $('#gtitle').textContent = 'Evaluando la ruta ' + r.idx.toLocaleString('es') + ' de ' + r.total.toLocaleString('es');
    $('#graphBox').innerHTML = drawGraph(G(), { path: r.lastOk ? camino : null, color: 'var(--alt)' });
    if (r.idx >= r.total) $('#nxt').textContent = 'Ver resultado final';
  }
  function nextStep() { if (S.busy) return; if (!stepRun(S.run)) return finish(); showStep(); }
  function nextValid() {
    if (S.busy) return;
    var r = S.run, found = false;
    while (stepRun(r)) { if (r.lastOk) { found = true; break; } }
    if (!found) return finish();
    showStep();
  }
  function finishAll() {
    if (S.busy) return;
    S.busy = true;
    var r = S.run;
    $('#stepBtns').querySelectorAll('button').forEach(function (b) { b.disabled = true; });
    $('#prog').hidden = false;
    (function tick() {
      var t0 = performance.now();
      while (performance.now() - t0 < 25) { if (!stepRun(r)) { S.busy = false; return finish(); } }
      var pct = Math.min(100, r.idx / r.total * 100);
      $('#progBar').style.width = pct.toFixed(1) + '%';
      $('#progTxt').textContent = 'Evaluando ' + r.idx.toLocaleString('es') + ' de ' + r.total.toLocaleString('es') + ' rutas';
      setTimeout(tick, 0);
    })();
  }
  function finish() { S.busy = false; S.sum = summarize(S.run, 500); S.sel = 0; go('result'); }

  /* ---------- Pantalla 4: resultado ---------- */
  function resultText() {
    var sm = S.sum, r = S.run, n = r.n;
    var head = '      ' + Array.from({ length: n }, function (_, j) { return String(j).padStart(5); }).join(' ');
    var lines = [head];
    for (var i = 0; i < n; i++) lines.push(String(i).padStart(3) + ' : ' + r.m[i].map(function (x) { return (x > 0 ? fmt(x) : '-').padStart(5); }).join(' '));
    return 'TSP por fuerza bruta\n' + (S.user ? 'Usuario: ' + S.user + '\n' : '') + 'Fecha: ' + new Date().toLocaleString('es-PE') + '\n' +
      'Nodos: ' + n + ' | Máx. entrantes: ' + S.maxIn + ' | Máx. salientes: ' + S.maxOut + '\n\nMatriz de costos (fila = origen, columna = destino):\n' + lines.join('\n') + '\n\n' +
      'Búsqueda: ' + r.text + '\nCiclos hamiltonianos únicos encontrados: ' + sm.count + '\nRuta óptima: ' + sm.top[0].route.join(' -> ') + '\nCosto mínimo: ' + fmt(sm.best) + '\n';
  }
  function copyText(text, msgEl, okMsg) {
    var fallback = function () {
      msgEl.innerHTML = 'No se pudo copiar de forma automática. Selecciona el texto y cópialo:<textarea class="imp" readonly style="margin-top:6px;min-height:110px"></textarea>';
      var ta = msgEl.querySelector('textarea'); ta.value = text; ta.focus(); ta.select();
    };
    try { navigator.clipboard.writeText(text).then(function () { msgEl.textContent = okMsg; }, fallback); } catch (e) { fallback(); }
  }
  /* ---------- Informe PDF ---------- */
  function getDl() {
    return Promise.resolve({
      save: function(opt) {
        // Genera el archivo directamente usando el navegador
        var blob = new Blob([opt.data], { type: 'application/pdf' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = opt.filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        return Promise.resolve();
      }
    });
  }
  var ORIGIN_NAME = { manual: 'Manual', aleatorio: 'Aleatorio mixto', importado: 'Importado' };
  function reportInfo(withResult) {
    var r = withResult ? S.run : null, n = r ? r.n : S.n, m = r ? r.m : S.m;
    var d = diagnose(n, m), c = countTypes(n, m), texts = [];
    if (d.sinSalida.length) texts.push('Nodos sin aristas salientes: ' + d.sinSalida.join(', ') + '.');
    if (d.sinEntrada.length) texts.push('Nodos sin aristas entrantes: ' + d.sinEntrada.join(', ') + '.');
    if (!d.sinSalida.length && !d.sinEntrada.length && !d.conexo) texts.push('El grafo no es fuertemente conexo.');
    var origins = Object.keys(S.used).map(function (k) { return ORIGIN_NAME[k]; }).join(' + ') || 'No indicado';
    return {
      user: S.user, date: new Date().toLocaleString('es-PE'), n: n, maxIn: S.maxIn, maxOut: S.maxOut, m: m, origins: origins,
      tipo: isComplete(n, m) ? 'Grafo completo' : 'Grafo incompleto', counts: c, edges: 2 * c.bi + 2 * c.dif + c.uni,
      diagOk: !texts.length, diagTexts: texts, modo: modoBusqueda(n, m).text,
      sum: withResult && S.sum ? { best: S.sum.best, nOpt: S.sum.nOpt, count: S.sum.count, top: S.sum.top, route: S.sum.top[0].route } : null
    };
  }
  var LIGHT = { '--ok': '#1b7f1b', '--sel': '#2a62b8', '--alt': '#b8600f', '--on-hl': '#ffffff', '--edge': '#7d8693', '--edge-dim': '#cfd4dc', '--ink': '#16202e', '--muted': '#586577', '--surface': '#ffffff', '--primary': '#1f3a5f', '--node': '#bcdcf2', '--gold': '#f2c14e' };
  var PRINT_CSS = '.e-base{stroke:#7d8693;stroke-width:1.6;fill:none}.e-dim{stroke:#cfd4dc;stroke-width:1.3;fill:none}.e-hl{fill:none;stroke-width:4.2;stroke-linecap:round}.mk-b{fill:#7d8693}.mk-d{fill:#cfd4dc}.node{fill:#bcdcf2;stroke:#1f3a5f;stroke-width:2}.node.start{fill:#f2c14e}.nlab{fill:#16202e;font-weight:700;text-anchor:middle;font-family:Arial,Helvetica,sans-serif}.nlab.start{fill:#1a1a1a}.wlab{fill:#16202e;font-size:13px;font-weight:600;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;font-family:Arial,Helvetica,sans-serif}.wlab.dim{fill:#586577}.chip text{fill:#fff;font-size:13px;font-weight:700;text-anchor:middle;font-family:Arial,Helvetica,sans-serif}';
  function graphPng(g, opt) {
    return new Promise(function (res, rej) {
      var svg = drawGraph(g, opt).replace(/var\((--[a-z-]+)\)/g, function (_, k) { return LIGHT[k] || '#000'; })
        .replace('<svg class="graph"', '<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1100"')
        .replace(/(<svg[^>]*>)/, '$1<style>' + PRINT_CSS + '</style><rect width="560" height="560" fill="#fff"/>');
      var url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' })), img = new Image();
      img.onload = function () {
        var c = document.createElement('canvas'); c.width = c.height = 1100;
        c.getContext('2d').drawImage(img, 0, 0, 1100, 1100); URL.revokeObjectURL(url); res(c.toDataURL('image/png'));
      };
      img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('no se pudo dibujar el grafo')); };
      img.src = url;
    });
  }
async function downloadReport(withResult, btn, msgEl) {
    var say = function (t, c) { msgEl.textContent = t; msgEl.className = 'msg ' + (c || ''); };
    if (!window.jspdf) return say('No se cargó el generador de PDF. Revisa tu conexión y recarga la página, o usa "Copiar resultado".', 'bad');
    var dl = await getDl();
    btn.disabled = true; say('Preparando el informe…');
    try {
      var info = reportInfo(withResult), png = await graphPng({ n: info.n, m: info.m, pos: S.pos }, info.sum ? { path: info.sum.route, color: 'var(--ok)' } : {});
      var doc = buildReportPdf(window.jspdf.jsPDF, info, png);
      var base = (S.user ? S.user.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9]+/g, '_') + '_' : '');
      var name = 'informe_TSP_' + base + (info.sum ? 'resultado' : 'grafo') + '.pdf';
      await dl.save({ filename: name, data: doc.output('arraybuffer') });
      say('Informe listo: ' + name, 'ok');
    } catch (e) {
      say('No se pudo generar el informe' + (e && e.message ? ': ' + e.message : '.'), 'bad');
    }
    btn.disabled = false;
  }

  function viewResult() {
    var r = S.run, sm = S.sum, v = $('#view');
    if (!sm) {
      var d = diagnose(r.n, r.m), sug = suggestEdges({ n: r.n, m: r.m, maxIn: S.maxIn, maxOut: S.maxOut }, d).slice(0, 8);
      v.innerHTML = '<div class="grid"><section class="panel stack"><h1>No hay ciclo hamiltoniano</h1>' +
        '<p class="lead">Ninguna ruta recorre todos los nodos y vuelve al 0 siguiendo el sentido de las aristas.</p>' +
        (sug.length ? '<div class="callout bad"><b>Aristas sugeridas</b><ul>' + sug.map(function (s) { return '<li>Agregar ' + s[0] + ' → ' + s[1] + '</li>'; }).join('') + '</ul></div>' : '<p class="hint">Revisa el sentido de las aristas: cada nodo tiene alguna conexión, pero ninguna combinación cierra el recorrido.</p>') +
        '<div class="actions"><button class="btn primary" id="edit" type="button">Editar el grafo</button><button class="btn" id="neu" type="button">Nuevo grafo</button></div></section>' +
        '<section class="panel pane-graph"><h2>Grafo sin ciclo hamiltoniano</h2>' + drawGraph({ n: r.n, m: r.m, pos: S.pos }) + legend() + '</section></div>';
    } else {
      v.innerHTML = '<div class="grid"><section class="panel stack">' +
        '<h1 style="color:var(--ok)">Solución óptima del TSP</h1>' + (S.user ? '<p class="hint">Resultado de ' + esc(S.user) + '</p>' : '') +
        '<div><p class="hint">Costo mínimo</p><p class="big">' + fmt(sm.best) + '</p></div>' +
        '<div><p class="hint">Ruta óptima</p><p class="route">' + sm.top[0].route.join(' → ') + '</p></div>' +
        '<p>Ciclos hamiltonianos únicos encontrados: <b>' + sm.count.toLocaleString('es') + '</b>' + (sm.nOpt > 1 ? ' (' + sm.nOpt.toLocaleString('es') + ' con el costo mínimo)' : '') + '</p>' +
        '<p class="hint">' + esc(r.text) + '</p>' +
        '<div><h2>Ciclos válidos ordenados por costo' + (sm.count > 500 ? ' (primeros 500)' : '') + '</h2><p class="hint">Toca una fila para verla en el grafo. Fondo azul claro = costo mínimo.</p></div>' +
        '<div class="results" id="res"></div>' +
        '<div class="actions"><button class="btn primary" id="repR" type="button">Descargar informe (PDF)</button><button class="btn" id="copyR" type="button">Copiar resultado</button><button class="btn" id="edit" type="button">Editar este grafo</button><button class="btn" id="neu" type="button">Nuevo grafo</button></div>' +
        '<p id="copyRMsg" class="hint" role="status"></p></section>' +
        '<section class="panel pane-graph"><h2 id="gtitle"></h2><div id="graphBox"></div>' + legend() + '</section></div>';
      $('#res').innerHTML = sm.top.map(function (t, k) {
        return '<button type="button" data-k="' + k + '" class="' + (Math.abs(t.cost - sm.best) < 1e-9 ? 'best' : '') + '"><span>' + (k + 1) + '</span><span>' + t.route.join(' → ') + '</span><span>' + fmt(t.cost) + '</span></button>';
      }).join('');
      $('#res').addEventListener('click', function (e) { var b = e.target.closest('button[data-k]'); if (b) { S.sel = Number(b.dataset.k); paintResult(); } });
      $('#repR').addEventListener('click', function () { downloadReport(true, $('#repR'), $('#copyRMsg')); });
      $('#copyR').addEventListener('click', function () { copyText(resultText(), $('#copyRMsg'), 'Resultado copiado al portapapeles.'); });
      paintResult();
    }
    $('#edit').addEventListener('click', function () { go('build'); });
    $('#neu').addEventListener('click', function () { S.m = null; go('config'); });
  }
  function paintResult() {
    var sm = S.sum, t = sm.top[S.sel], best = Math.abs(t.cost - sm.best) < 1e-9;
    $('#gtitle').textContent = (S.sel === 0 ? 'Ciclo óptimo resaltado' : 'Ruta ' + (S.sel + 1)) + ' (costo ' + fmt(t.cost) + ')';
    $('#graphBox').innerHTML = drawGraph({ n: S.run.n, m: S.run.m, pos: S.pos }, { path: t.route, color: best ? 'var(--ok)' : 'var(--sel)' });
    document.querySelectorAll('#res button').forEach(function (b) { if (Number(b.dataset.k) === S.sel) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current'); });
  }

  $('#navBack').addEventListener('click', goBack);
  $('#navHome').addEventListener('click', goHome);
  $('#user').addEventListener('input', function () { S.user = $('#user').value.replace(/\s+/g, ' ').trim(); });
  render();
})();
</script>

</body></html>
